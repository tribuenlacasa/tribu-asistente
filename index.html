<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14532d">
    <title>Tribu Asistente</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section class="card hero">
        <div class="brand"><div class="mark">T</div><div><h1>Tribu Asistente</h1><p>Información de pago del evento</p></div></div>
        <div id="status" class="status ready">Cargando datos...</div>
      </section>

      <section id="eventCard" class="card" hidden>
        <h2 id="eventName">Evento</h2>
        <p id="eventMeta" class="muted"></p>
        <p id="eventDescription"></p>
      </section>

      <section id="paymentCard" class="card" hidden>
        <h2>Datos de pago</h2>
        <div class="info-grid">
          <div><span>Monto sugerido</span><strong id="amount">-</strong></div>
          <div><span>Alias</span><strong id="alias">-</strong></div>
          <div><span>Titular</span><strong id="holder">-</strong></div>
          <div><span>CVU/CBU</span><strong id="cvu">-</strong></div>
        </div>
        <p id="instructions" class="muted"></p>
        <div class="actions">
          <button id="copyAliasBtn" class="btn secondary" type="button">Copiar alias</button>
          <button id="openMpBtn" class="btn primary" type="button">Abrir Mercado Pago</button>
        </div>
      </section>

      <section id="guestCard" class="card" hidden>
        <h2>Tu entrada</h2>
        <p><strong id="guestName">Invitado</strong></p>
        <p class="muted">Estado de pago: <span id="paymentStatus">-</span></p>
      </section>

      <section id="formCard" class="card" hidden>
        <h2>Ya pagué</h2>
        <p class="muted">Avisá a producción para que revise el pago manualmente.</p>
        <label>Nombre<input id="nameInput"></label>
        <label>Contacto<input id="contactInput"></label>
        <label>Método de pago<select id="methodInput"><option>Mercado Pago</option><option>Transferencia</option><option>Efectivo</option><option>Otro</option></select></label>
        <label>Referencia de pago<input id="referenceInput" placeholder="Ej: operación, alias, comentario"></label>
        <label>Monto pagado<input id="paidAmountInput" inputmode="decimal"></label>
        <label>Link o texto de comprobante<textarea id="proofInput" rows="3"></textarea></label>
        <label>Comentario<textarea id="commentInput" rows="3"></textarea></label>
        <button id="submitBtn" class="btn primary" type="button">Enviar aviso de pago</button>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
